name: Publish Vintage website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Validate and prepare website
        run: |
          node --check app.js
          test -s index.html
          test -s style.css
          test -s logo.jpg
          grep -q "brand-logo" index.html
          mkdir -p _site
          cp index.html style.css app.js logo.jpg _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
